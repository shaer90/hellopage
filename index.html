<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legacy Maxillofacial Surgery &amp; Implant Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #ffffff;
    --pink: #ec4899;
    --blue: #3b82f6;
    --text: #1a1a2e;
    --muted: #6b7280;
    --gradient: linear-gradient(90deg, var(--blue), var(--pink));
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    overflow: hidden;
  }
  .glow {
    position: fixed;
    top: 20%;
    width: 55vw;
    height: 55vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    filter: blur(120px);
    z-index: -1;
    opacity: 0.15;
    pointer-events: none;
  }
  .glow-pink { right: -15%; background: var(--pink); }
  .glow-blue { left: -15%; background: var(--blue); }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo {
    max-width: min(420px, 80vw);
    width: 100%;
    height: auto;
    margin-bottom: 40px;
    filter: drop-shadow(0 0 18px rgba(0, 0, 0, 0.5));
  }
  .title-ar {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    margin: 0 0 10px;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title-en {
    font-family: "Poppins", "Segoe UI", Tahoma, sans-serif;
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 28px;
  }
  .subtitle {
    font-size: 1rem;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.8;
    margin: 0;
  }
  .subtitle .en {
    display: block;
    font-family: "Poppins", "Segoe UI", Tahoma, sans-serif;
    font-size: 0.9rem;
    margin-top: 6px;
    direction: ltr;
  }
</style>
</head>
<body>
  <div class="glow glow-pink"></div>
  <div class="glow glow-blue"></div>

  <div class="wrap">
    <img class="logo" src="logo.png" alt="Legacy Maxillofacial Surgery & Implant Center" />
    <h1 class="title-ar">قريبًا</h1>
    <p class="title-en">Coming Soon</p>
    <p class="subtitle">
      الموقع تحت الإنشاء حاليًا، ترقبونا قريبًا.
      <span class="en">Our website is currently under construction.<br />Stay tuned.</span>
    </p>
  </div>
</body>
</html>
