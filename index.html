<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Legacy Maxillofacial Surgery &amp; Implant Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #04040a;
    --pink: #ec4899;
    --blue: #3b82f6;
    --text: #f3f4f8;
    --muted: #9ca3af;
    --gradient: linear-gradient(90deg, var(--blue), var(--pink));
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Cairo", "Segoe UI", Tahoma, sans-serif;
    overflow: hidden;
  }
  #starfield {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: -2;
    background: var(--bg);
  }
  .glow {
    position: fixed;
    top: 20%;
    width: 55vw;
    height: 55vw;
    max-width: 700px;
    max-height: 700px;
    border-radius: 50%;
    filter: blur(120px);
    z-index: -1;
    opacity: 0.22;
    pointer-events: none;
    mix-blend-mode: screen;
  }
  .glow-pink { right: -15%; background: var(--pink); }
  .glow-blue { left: -15%; background: var(--blue); }

  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .logo {
    max-width: min(420px, 80vw);
    width: 100%;
    height: auto;
    margin-bottom: 40px;
    filter: drop-shadow(0 0 18px rgba(0, 0, 0, 0.5));
  }
  .title-ar {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    margin: 0 0 10px;
    background: var(--gradient);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .title-en {
    font-family: "Poppins", "Segoe UI", Tahoma, sans-serif;
    font-size: clamp(1rem, 2.4vw, 1.3rem);
    font-weight: 500;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 28px;
  }
  .subtitle {
    font-size: 1rem;
    color: var(--muted);
    max-width: 480px;
    line-height: 1.8;
    margin: 0;
  }
  .subtitle .en {
    display: block;
    font-family: "Poppins", "Segoe UI", Tahoma, sans-serif;
    font-size: 0.9rem;
    margin-top: 6px;
    direction: ltr;
  }
</style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="glow glow-pink"></div>
  <div class="glow glow-blue"></div>

  <div class="wrap">
    <img class="logo" src="logo.png" alt="Legacy Maxillofacial Surgery & Implant Center" />
    <h1 class="title-ar">قريبًا</h1>
    <p class="title-en">Coming Soon</p>
    <p class="subtitle">
      الموقع تحت الإنشاء حاليًا، ترقبونا قريبًا.
      <span class="en">Our website is currently under construction. Stay tuned.</span>
    </p>
  </div>

  <script>
    (function () {
      var canvas = document.getElementById('starfield');
      var ctx = canvas.getContext('2d');
      var width, height, dpr;
      var stars = [];
      var frame = 0;
      var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var colors = ['255,255,255', '255,255,255', '255,255,255', '147,197,253', '196,181,253'];

      function resize() {
        dpr = 1;
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        var count = Math.floor((width * height) / 9000);
        stars = new Array(count).fill(0).map(function () {
          return {
            x: Math.random() * width,
            y: Math.random() * height,
            r: Math.random() * 1.3 + 0.3,
            baseAlpha: Math.random() * 0.6 + 0.3,
            speed: Math.random() * 0.02 + 0.005,
            phase: Math.random() * Math.PI * 2,
            color: colors[Math.floor(Math.random() * colors.length)],
          };
        });
      }

      function draw() {
        frame++;
        ctx.clearRect(0, 0, width, height);
        for (var i = 0; i < stars.length; i++) {
          var s = stars[i];
          var twinkle = reduceMotion ? 0 : Math.sin(frame * s.speed + s.phase) * 0.35;
          var alpha = Math.max(0, Math.min(1, s.baseAlpha + twinkle));
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(' + s.color + ',' + alpha + ')';
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }

      window.addEventListener('resize', resize);
      resize();
      draw();
    })();
  </script>
</body>
</html>
